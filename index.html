<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6C63FF">
    <meta name="description" content="Генератор красивых QR-кодов">
    <title>QR Magic Generator</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6C63FF;
            --secondary: #4D44DB;
            --dark: #2F2E41;
            --light: #F8F9FA;
            --accent: #FF6584;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            padding: 20px 0;
        }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            position: relative;
            z-index: 2;
        }
        
        .subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
            position: relative;
            z-index: 2;
        }
        
        .header-decoration {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(108, 99, 255, 0.2) 0%, rgba(108, 99, 255, 0) 70%);
            animation: float 6s ease-in-out infinite;
        }
        
        .decoration-1 {
            top: -50px;
            left: -50px;
            animation-delay: 0s;
        }
        
        .decoration-2 {
            bottom: -80px;
            right: -30px;
            animation-delay: 1s;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }
        
        .qr-generator {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateY(20px);
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        @keyframes fadeIn {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-family: inherit;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.3);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(77, 68, 219, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(77, 68, 219, 0.6);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0) 45%,
                rgba(255, 255, 255, 0.3) 48%,
                rgba(255, 255, 255, 0) 52%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            animation: shine 3s infinite;
            opacity: 0;
        }
        
        @keyframes shine {
            0% {
                left: -50%;
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                left: 150%;
                opacity: 0;
            }
        }
        
        .qr-result {
            text-align: center;
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }
        
        #qr-code {
            margin: 0 auto;
            padding: 15px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            max-width: 250px;
        }
        
        #qr-code::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                135deg,
                rgba(108, 99, 255, 0.1) 0%,
                rgba(108, 99, 255, 0) 20%,
                rgba(108, 99, 255, 0) 80%,
                rgba(108, 99, 255, 0.1) 100%
            );
            pointer-events: none;
        }
        
        .download-btn {
            display: inline-block;
            margin-top: 20px;
            background: var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 101, 132, 0.4);
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 101, 132, 0.6);
        }
        
        .options {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .option-item {
            flex: 1;
        }
        
        footer {
            text-align: center;
            margin-top: auto;
            padding: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float-particle linear infinite;
        }
        
        @keyframes float-particle {
            to {
                transform: translateY(-100vh);
            }
        }
        
        .install-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
            cursor: pointer;
            display: none;
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .install-btn:hover {
            transform: scale(1.1);
        }
        
        @media (max-width: 400px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .options {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <button id="installButton" class="install-btn" title="Установить приложение">+</button>
    
    <div class="container">
        <header>
            <div class="header-decoration decoration-1"></div>
            <div class="header-decoration decoration-2"></div>
            <h1>QR Magic Generator</h1>
            <p class="subtitle">Создавайте стильные QR-коды в один клик</p>
        </header>
        
        <main>
            <div class="qr-generator">
                <div class="input-group">
                    <label for="qr-content">Введите текст или URL</label>
                    <textarea id="qr-content" placeholder="https://example.com или любой текст"></textarea>
                </div>
                
                <div class="options">
                    <div class="option-item input-group">
                        <label for="qr-color">Цвет</label>
                        <select id="qr-color">
                            <option value="#000000">Чёрный</option>
                            <option value="#6C63FF" selected>Фиолетовый</option>
                            <option value="#FF6584">Розовый</option>
                            <option value="#4CAF50">Зелёный</option>
                            <option value="#2196F3">Голубой</option>
                        </select>
                    </div>
                    
                    <div class="option-item input-group">
                        <label for="qr-size">Размер</label>
                        <select id="qr-size">
                            <option value="200">Средний</option>
                            <option value="150">Маленький</option>
                            <option value="250">Большой</option>
                        </select>
                    </div>
                </div>
                
                <button id="generate-btn" class="btn">
                    <span>Сгенерировать QR-код</span>
                </button>
                
                <div class="qr-result" id="qr-result">
                    <div id="qr-code"></div>
                    <a href="#" class="download-btn" id="download-btn">Скачать QR-код</a>
                </div>
            </div>
        </main>
        
        <footer>
            <p>QR Magic Generator © 2023 | Создавайте и делитесь</p>
        </footer>
    </div>
    
    <script>
        // Создание частиц фона
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = Math.floor(window.innerWidth / 10);
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Случайные параметры частицы
                const size = Math.random() * 5 + 1;
                const posX = Math.random() * window.innerWidth;
                const duration = Math.random() * 20 + 10;
                const delay = Math.random() * 20;
                const opacity = Math.random() * 0.5 + 0.1;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}px`;
                particle.style.top = `${window.innerHeight}px`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.opacity = opacity;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Генерация QR-кода с использованием Canvas
        function generateQRCode() {
            const content = document.getElementById('qr-content').value.trim();
            const color = document.getElementById('qr-color').value;
            const size = parseInt(document.getElementById('qr-size').value);
            
            if (!content) {
                alert('Пожалуйста, введите текст или URL для QR-кода');
                return;
            }
            
            const qrCodeElement = document.getElementById('qr-code');
            qrCodeElement.innerHTML = '';
            
            // Создаем canvas для QR-кода
            const canvas = document.createElement('canvas');
            qrCodeElement.appendChild(canvas);
            
            // Используем библиотеку QRious для генерации QR-кода
            const qr = new QRious({
                element: canvas,
                value: content,
                size: size,
                foreground: color,
                background: 'white',
                padding: 25
            });
            
            document.getElementById('qr-result').style.display = 'block';
            
            // Настройка кнопки скачивания
            const downloadBtn = document.getElementById('download-btn');
            downloadBtn.onclick = function(e) {
                e.preventDefault();
                const link = document.createElement('a');
                link.download = 'qr-code.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
        }
        
        // PWA: Установка приложения
        let deferredPrompt;
        const installButton = document.getElementById('installButton');
        
        window.addEventListener('beforeinstallprompt', (e) => {
            // Предотвращаем автоматическое отображение подсказки
            e.preventDefault();
            // Сохраняем событие для последующего использования
            deferredPrompt = e;
            // Показываем кнопку установки
            installButton.style.display = 'block';
        });
        
        installButton.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            
            // Показываем подсказку установки
            deferredPrompt.prompt();
            
            // Ждем, пока пользователь ответит на подсказку
            const { outcome } = await deferredPrompt.userChoice;
            
            // Убираем кнопку независимо от выбора пользователя
            installButton.style.display = 'none';
            
            // Очищаем сохраненное событие
            deferredPrompt = null;
        });
        
        window.addEventListener('appinstalled', () => {
            // Скрываем кнопку установки после успешной установки
            installButton.style.display = 'none';
            deferredPrompt = null;
        });
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            
            // Загружаем библиотеку QRious динамически
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js';
            script.onload = function() {
                document.getElementById('generate-btn').addEventListener('click', generateQRCode);
            };
            document.head.appendChild(script);
            
            // Анимация кнопки при наведении
            const btn = document.querySelector('.btn');
            btn.addEventListener('mouseenter', function() {
                this.querySelector('span').style.animation = 'none';
                void this.querySelector('span').offsetWidth; // Trigger reflow
                this.querySelector('span').style.animation = null;
            });
        });
        
        // Пересоздание частиц при изменении размера окна
        window.addEventListener('resize', function() {
            const particlesContainer = document.getElementById('particles');
            particlesContainer.innerHTML = '';
            createParticles();
        });
    </script>
</body>
</html>
